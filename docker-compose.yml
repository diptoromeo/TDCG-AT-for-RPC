version: "3.9"
services:
  classifier:
    build: .
    container_name: tdcg-classifier
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data/raw
      - PROC_DIR=/app/data/processed
      - EXT_DIR=/app/data/external
      - MAX_EXT_PAPERS=200000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
